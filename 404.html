<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131f">
<meta name="robots" content="noindex, follow">
<title>404 — DamarFlow</title>
<link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#06111b;--panel:#0c1d2b;--line:rgba(150,190,210,.18);--text:#edf6fa;--muted:#91a9b7;--cyan:#55d6e8;--gold:#e7c56a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(36,174,202,.12),transparent 30rem),var(--bg);color:var(--text);font-family:Arial,sans-serif}
main{width:min(720px,calc(100% - 36px));padding:54px;border:1px solid var(--line);border-radius:28px;background:rgba(12,29,43,.78);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.logo{font-size:20px;font-weight:700;letter-spacing:.02em}.logo span{color:var(--cyan)}
.code{margin:45px 0 8px;font-size:96px;line-height:1;font-weight:800;letter-spacing:-.06em;color:var(--cyan)}
h1{font-size:28px;margin:0 0 12px}p{color:var(--muted);line-height:1.7}
a{display:inline-flex;margin-top:18px;padding:13px 20px;border-radius:12px;text-decoration:none;background:var(--cyan);color:#05202a;font-weight:700}
.mono{font-family:monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
</style>
</head>
<body><main>
<div class="logo">DAMAR<span>FLOW</span></div>
<div class="code">404</div>
<div class="mono">FIELD NOT FOUND</div>
<h1>This route does not exist.</h1>
<p>The requested scientific field could not be resolved. Return to the DamarFlow research interface and continue exploring.</p>
<a href="/">Return to DamarFlow ↗</a>
</main></body></html>
